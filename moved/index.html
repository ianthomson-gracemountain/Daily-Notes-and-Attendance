<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>We've Moved to Summit</title>
  <link rel="icon" href="/logo.png">
  <style>
    :root {
      --green: #365347;
      --green-dark: #2a4239;
      --gold: #BA895C;
      --bg: #F1F1F1;
      --card: #ffffff;
      --text: #1f2a26;
      --muted: #5b6661;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }
    main {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      text-align: center;
    }
    .brand { background: #365347; padding: 24px; }
    .brand img { width: 104px; height: auto; display: block; margin: 0 auto; }
    .body { padding: 8px 24px 32px; }
    h1 { color: var(--green); font-size: 1.75rem; margin: 16px 0 8px; }
    p { margin: 0 0 16px; font-size: 1.05rem; }
    .muted { color: var(--muted); font-size: 0.95rem; }
    a.button {
      display: block;
      margin: 24px 0;
      padding: 16px;
      border-radius: 12px;
      background: var(--green);
      color: #fff;
      font-weight: 600;
      font-size: 1.1rem;
      text-decoration: none;
    }
    a.button:hover, a.button:focus-visible { background: var(--green-dark); }
    a.button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="/logo.png" alt="Grace Mountain"></div>
    <div class="body">
    <h1>We've moved!</h1>
    <p>Daily notes and attendance now live in <strong>Summit</strong>.</p>
    <p class="muted">This old site is closed. Sign in to Summit with the same email you use for Grace Mountain.</p>
    <a class="button" href="https://summit-app-gm.netlify.app/">Go to Summit &rarr;</a>
    <p class="muted">Tip: after you sign in, add Summit to your home screen so it's one tap away.</p>
    <p class="muted">Can't sign in? Contact your care coordinator.</p>
    </div>
  </main>
</body>
</html>
